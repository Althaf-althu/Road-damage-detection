services:
  db:
    image: postgis/postgis:15-3.3
    container_name: road_damage_db
    restart: always
    environment:
      POSTGRES_DB: road_damage_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d road_damage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: road_damage_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: road_damage_backend
    restart: always
    env_file:
      - api_keys.env
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/road_damage_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: road_damage_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - api_keys.env
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/road_damage_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  ml_pipeline:
    build:
      context: ./ml_pipeline
      dockerfile: Dockerfile
    container_name: road_damage_ml
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./ml_pipeline/weights:/app/weights
      - ./backend/uploads:/app/uploads
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: road_damage_frontend
    restart: always
    env_file:
      - api_keys.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

