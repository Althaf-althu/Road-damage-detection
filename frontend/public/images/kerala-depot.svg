<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="depotBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#depotBg)" />

  <!-- Municipal Depot Headquarters Blueprint Lines -->
  <g stroke="#10b981" stroke-width="1" opacity="0.25">
    <circle cx="400" cy="225" r="180" fill="none" />
    <circle cx="400" cy="225" r="120" fill="none" stroke-dasharray="8, 6" />
    <circle cx="400" cy="225" r="60" fill="none" />
  </g>

  <!-- PWD Central Depot Building Silhouette -->
  <path d="M250,340 L250,180 L350,140 L450,140 L550,180 L550,340 Z" fill="#042f24" stroke="#059669" stroke-width="2" />
  <rect x="360" y="240" width="80" height="100" fill="#021c16" stroke="#10b981" stroke-width="1.5" />
  <rect x="280" y="200" width="50" height="40" rx="4" fill="#fef08a" opacity="0.8" />
  <rect x="470" y="200" width="50" height="40" rx="4" fill="#fef08a" opacity="0.8" />

  <!-- 30-Meter Geofence Verification Radar Pin -->
  <g transform="translate(400, 140)">
    <circle cx="0" cy="0" r="45" fill="#10b981" opacity="0.2" />
    <circle cx="0" cy="0" r="30" fill="#10b981" opacity="0.35" />
    <circle cx="0" cy="0" r="10" fill="#34d399" />
    <path d="M0,0 L0,-30" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <!-- Pulse Waves -->
    <circle cx="0" cy="0" r="75" stroke="#34d399" stroke-width="2" stroke-dasharray="6, 6" fill="none" opacity="0.7" />
  </g>

  <!-- Status Stamp Banner -->
  <g transform="translate(260, 360)">
    <rect width="280" height="40" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
    <text x="24" y="25" fill="#f0fdf4" font-family="sans-serif" font-size="12" font-weight="bold">
      TECHNICIAN GPS VERIFIED (&lt; 30 METERS)
    </text>
  </g>
</svg>
