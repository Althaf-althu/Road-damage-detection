<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="inspBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#inspBg)" />

  <!-- Perspective Grid of Road Surface -->
  <g stroke="#059669" stroke-width="0.8" opacity="0.3">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="230" x2="800" y2="230" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="380" x2="800" y2="380" />
    
    <line x1="400" y1="180" x2="0" y2="450" />
    <line x1="400" y1="180" x2="160" y2="450" />
    <line x1="400" y1="180" x2="320" y2="450" />
    <line x1="400" y1="180" x2="480" y2="450" />
    <line x1="400" y1="180" x2="640" y2="450" />
    <line x1="400" y1="180" x2="800" y2="450" />
  </g>

  <!-- Highlighted Road Corridor -->
  <path d="M220,450 L360,200 L440,200 L580,450 Z" fill="#1e293b" opacity="0.85" />
  <line x1="400" y1="200" x2="400" y2="450" stroke="#f59e0b" stroke-width="4" stroke-dasharray="14, 10" />

  <!-- 3D Defect Inspection Scan Box (Pothole Cavity) -->
  <g transform="translate(350, 310)">
    <ellipse cx="50" cy="30" rx="60" ry="25" fill="#7f1d1d" opacity="0.8" />
    <ellipse cx="50" cy="30" rx="45" ry="18" fill="#450a0a" />
    <!-- Reticle targeting lines -->
    <rect x="-20" y="-10" width="140" height="80" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6, 4" />
    <!-- Depth Vector -->
    <line x1="50" y1="10" x2="50" y2="45" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow)" />
    <!-- Telemetry Pill -->
    <rect x="0" y="-30" width="100" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="12" y="-15" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">DEPTH: 7.2 cm</text>
  </g>

  <!-- MCDA Formula HUD Card Top-Left -->
  <g transform="translate(40, 40)">
    <rect width="280" height="90" rx="12" fill="#032a1e" opacity="0.95" stroke="#10b981" stroke-width="1.5" />
    <text x="16" y="28" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="bold">MCDA PRIORITIZATION FORMULA</text>
    <text x="16" y="52" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">P = 0.40S + 0.25T + 0.20R + 0.15Z</text>
    <text x="16" y="74" fill="#fbbf24" font-family="sans-serif" font-size="11">CRITICAL SLA: 24 HOURS (SCORE: 88.5)</text>
  </g>
</svg>
